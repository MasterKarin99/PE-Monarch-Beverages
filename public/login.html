<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plannings éditoriaux pays</title>
<style>
:root{--ink:#2c3033;--muted:#666b70;--line:#dfe3e0;--paper:#fff;--bg:#f3f5f3;--accent:#4e7c5b;--accent-ink:#fff;--font:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#e6e9e7;--muted:#a2a8a4;--line:#30363a;--paper:#1c2022;--bg:#141719;--accent:#9cc4a6;--accent-ink:#10251a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);min-height:100vh;display:grid;place-items:center;padding:20px}
main{border-top:4px solid #81A68A;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.mlogo{background:#fff;border-radius:8px;padding:6px 10px;align-self:flex-start;box-shadow:0 0 0 1px var(--line)}.mlogo img{display:block;height:36px;width:auto}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:22px;margin:0}
p{margin:0;color:var(--muted)}
form{display:flex;flex-direction:column;gap:8px;margin-top:4px}
label{font-size:13px;font-weight:600}
input{font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
button,.btn{font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.5em;color:var(--ink)}
</style>
</head>
